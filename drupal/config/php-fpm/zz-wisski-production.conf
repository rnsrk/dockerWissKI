; Default PHP-FPM pool. Overridden at start by zzz-wisski-runtime.conf
; from PHP_FPM_MAX_CHILDREN. memory_limit is 1G (SPARQL ceiling).
[www]
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
request_terminate_timeout = 300
