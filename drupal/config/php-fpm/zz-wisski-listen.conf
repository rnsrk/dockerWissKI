; php:*-fpm ships listen = 9000 in docker.conf. Nginx talks to this socket
; (see config/nginx/drupal.conf). Later [www] files override earlier ones.
[www]
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
; docker.conf logs every request to stderr (duplicates nginx; floods compose).
access.log = /dev/null
; Isolated tmp for PHP workers only. Do not set image ENV TMPDIR (breaks
; Cursor git askpass sockets for the developer user).
env[TMPDIR] = /var/tmp/drupal
