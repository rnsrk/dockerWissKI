server {
  listen 80 default_server;
  server_name _;
  root /opt/drupal/web;
  index index.php index.html;

  # Relative Location headers keep the published host port (e.g. 3600→80).
  absolute_redirect off;

  client_max_body_size 512m;

  add_header X-Content-Type-Options "nosniff";
  add_header X-Frame-Options "SAMEORIGIN";
  add_header X-XSS-Protection "1; mode=block";

  location = /favicon.ico {
    log_not_found off;
    access_log off;
  }

  location = /robots.txt {
    allow all;
    log_not_found off;
    access_log off;
  }

  # Block common vulnerability scanners before Drupal/PHP.
  location ~* "(^|/)(wp-includes|wp-content|wp-admin|wp-login\.php|xmlrpc\.php|wlwmanifest\.xml)" {
    access_log off;
    return 403;
  }
  location ~* ^/(wp\d*|wordpress)(/|$) {
    access_log off;
    return 403;
  }
  location ~* ^/(cms|blog|shop|test|2018)/wp- {
    access_log off;
    return 403;
  }
  location ~* ^/(\.env|\.git|phpmyadmin|phpunit) {
    access_log off;
    return 403;
  }

  location ~* \.(?:css|js|gif|ico|jpe?g|png|svg|webp|woff2?)$ {
    expires 1y;
    add_header Cache-Control "max-age=31536000, public";
    try_files $uri @drupal;
  }

  location / {
    try_files $uri @drupal;
  }

  location @drupal {
    rewrite ^/(.*)$ /index.php?q=$1 last;
  }

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    # Debian nginx sets HTTP_HOST to $host, which strips the port. Drupal then
    # builds redirects as http://localhost/user/1?check_logged_in=1 instead of
    # http://localhost:3600/.... Pass the client Host header, including port.
    fastcgi_param HTTP_HOST $http_host;
    fastcgi_index index.php;
    fastcgi_pass unix:/run/php/php-fpm.sock;
    fastcgi_read_timeout 300;
    fastcgi_buffer_size 32k;
    fastcgi_buffers 64 32k;
  }

  location ~* ^/sites/.*/files/styles/ {
    try_files $uri @drupal;
  }

  location ~* \.(?:php|phtml)\. {
    return 403;
  }

  include /etc/nginx/snippets/iipsrv.conf;

  error_page 404 /index.php;
}

