; PHP settings shared by every WissKI image.

; WissKI: long SPARQL requests and large uploads.
max_execution_time = 300
max_input_time = 300
max_input_nesting_level = 64000
max_input_vars = 10000
memory_limit = 1G
upload_max_filesize = 512M
max_file_uploads = 50
post_max_size = 512M

; Drupal: output buffering, and a temp dir that only PHP uses (see the
; Dockerfile for why TMPDIR is not set image-wide).
output_buffering = on
sys_temp_dir = /var/tmp/drupal
upload_tmp_dir = /var/tmp/drupal

; Sessions.
session.gc_maxlifetime = 7200
session.gc_probability = 1
session.gc_divisor = 100

; No assert() overhead; do not show deprecation notices.
zend.assertions = -1
error_reporting = E_ALL & ~E_DEPRECATED
