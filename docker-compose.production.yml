# Production: Varnish is the site upstream (Caddy is public HTTP when proxy overlay is loaded).
# Loaded via COMPOSE_FILE in env/production.env. Requires COMPOSE_PROFILES=production.

services:
  varnish:
    ports:
      - ${HTTP_PORT:-80}:80

  drupal:
    ports:
      - 127.0.0.1:${DRUPAL_DIRECT_PORT:-8082}:80
