name: dockerwisski

include:
  - path: opengdb/docker-compose.yml

configs:
  varnish_vcl:
    file: ./config/varnish/default.vcl
  pgadmin_servers:
    file: ./config/pgadmin/servers.json

services:
  drupal:
    image: ghcr.io/rnsrk/dockerwisski-${MODE:-production}:${WISSKI_IMAGE_VERSION:-latest}
    pull_policy: missing
    restart: unless-stopped
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      solr:
        condition: service_healthy
      nginx:
        condition: service_started
    environment:
      DB_DRIVER: ${DB_DRIVER:-pgsql}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-wisski}
      DB_USER: ${DB_USER:-wisski}
      DB_PASSWORD: ${DB_PASSWORD:-wisski}
      DRUPAL_DOMAIN: ${DRUPAL_DOMAIN:-localhost}
      DRUPAL_LOCALE: ${DRUPAL_LOCALE:-en}
      DRUPAL_PASSWORD: ${DRUPAL_PASSWORD:-admin}
      DRUPAL_PRIVATE_FILES_DIR: ${DRUPAL_PRIVATE_FILES_DIR:-/opt/drupal/private-files}
      DRUPAL_PROXY_ADDRESSES: ${DRUPAL_PROXY_ADDRESSES:-none}
      DRUPAL_SITE_NAME: ${DRUPAL_SITE_NAME:-My WissKI}
      DRUPAL_TRUSTED_HOSTS: ${DRUPAL_TRUSTED_HOSTS:-'^localhost$|^127\.0\.0\.1$'}
      DRUPAL_USER: ${DRUPAL_USER:-admin}
      MODE: ${MODE:-production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TS_PASSWORD: ${TS_PASSWORD:-}
      TS_READ_URL: http://nginx/repositories/${TS_REPOSITORY:-default}
      TS_REPOSITORY: ${TS_REPOSITORY:-default}
      TS_TOKEN: ${TS_TOKEN:-}
      TS_USERNAME: ${TS_USERNAME:-}
      TS_WRITE_URL: http://nginx/repositories/${TS_REPOSITORY:-default}/statements
      WISSKI_DEFAULT_DATA_MODEL_VERSION: ${WISSKI_DEFAULT_DATA_MODEL_VERSION:-true}
      WISSKI_DEFAULT_GRAPH: ${WISSKI_DEFAULT_GRAPH:-https://my.wiss-ki.eu/}
      WISSKI_STARTER_VERSION: ${WISSKI_STARTER_VERSION:-true}
    volumes:
      - drupal-sites:/opt/drupal/web/sites
      - drupal-private-files:/opt/drupal/private-files
      - drupal-custom-modules:/opt/drupal/web/modules/custom
      - drupal-custom-themes:/opt/drupal/web/themes/custom
      - composer-cache:/var/composer-home
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 30m
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-wisski}
      POSTGRES_USER: ${DB_USER:-wisski}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wisski}
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=200
      - -c
      - wal_buffers=16MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_cache_size=2GB
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres/init-pg_trgm.sql:/docker-entrypoint-initdb.d/01-pg_trgm.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1000 --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M

  solr:
    image: solr:9.7
    restart: unless-stopped
    environment:
      SOLR_JAVA_MEM: "-Xms512M -Xmx1G"
      SOLR_ULIMIT_CHECKS: "false"
      SOLR_OPTS: "-Djava.security.manager=allow"
    ulimits:
      nofile:
        soft: 65000
        hard: 65000
    volumes:
      - solr-data:/var/solr
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8983/solr/admin/info/system"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 512M

  varnish:
    image: varnish:7.6
    profiles: [production]
    restart: unless-stopped
    depends_on:
      drupal:
        condition: service_healthy
    environment:
      VARNISH_SIZE: ${VARNISH_SIZE:-256M}
    configs:
      - source: varnish_vcl
        target: /etc/varnish/default.vcl
    tmpfs:
      - /var/lib/varnish/varnishd:exec,uid=999,gid=999
    ulimits:
      memlock:
        soft: 536870912
        hard: 536870912
    healthcheck:
      test: ["CMD", "varnishstat", "-1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  pgadmin:
    image: dpage/pgadmin4:8
    profiles: [tools]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    configs:
      - source: pgadmin_servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  drupal-sites:
  drupal-private-files:
  drupal-custom-modules:
  drupal-custom-themes:
  composer-cache:
  postgres-data:
  redis-data:
  solr-data:
  pgadmin-data:
