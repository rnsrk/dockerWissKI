# Default stack. Environment is docker-compose.development.yml or
# docker-compose.production.yml via COMPOSE_FILE in .env.
# Optional overlays: docker-compose.local-build.yml, docker-compose.apple-silicon.yml,
# docker-compose.override.yml (gitignored).

name: dockerwisski

include:
  - path: opengdb/docker-compose.yml

configs:
  varnish_vcl:
    file: ./config/varnish/default.vcl

services:
  drupal:
    image: ghcr.io/rnsrk/dockerwisski-${MODE:-production}:${WISSKI_IMAGE_VERSION:-latest}
    pull_policy: missing
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rdf4j:
        condition: service_healthy
      authproxy:
        condition: service_healthy
    environment:
      DB_DRIVER: ${DB_DRIVER:-pgsql}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-wisski}
      DB_USER: ${DB_USER:-wisski}
      DB_PASSWORD: ${DB_PASSWORD:-wisski}
      DRUPAL_DOMAIN: ${DRUPAL_DOMAIN:-localhost}
      DRUPAL_LOCALE: ${DRUPAL_LOCALE:-en}
      DRUPAL_PASSWORD: ${DRUPAL_PASSWORD:-admin}
      DRUPAL_PRIVATE_FILES_DIR: ${DRUPAL_PRIVATE_FILES_DIR:-/opt/drupal/private-files}
      DRUPAL_PROXY_ADDRESSES: ${DRUPAL_PROXY_ADDRESSES:-none}
      DRUPAL_SITE_NAME: ${DRUPAL_SITE_NAME:-My WissKI}
      DRUPAL_TRUSTED_HOSTS: ${DRUPAL_TRUSTED_HOSTS:-'^localhost$|^127\.0\.0\.1$'}
      DRUPAL_USER: ${DRUPAL_USER:-admin}
      ENTRYPOINT_DEBUG: ${ENTRYPOINT_DEBUG:-}
      MODE: ${MODE:-production}
      NGINX_WORKER_PROCESSES: ${NGINX_WORKER_PROCESSES:-2}
      PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-6}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TS_PASSWORD: ${TS_PASSWORD:-}
      TS_READ_URL: http://authproxy:8000/repositories/${TS_REPOSITORY:-default}
      TS_REPOSITORY: ${TS_REPOSITORY:-default}
      TS_TOKEN: ${TS_TOKEN:-}
      TS_USERNAME: ${TS_USERNAME:-}
      TS_WRITE_URL: http://authproxy:8000/repositories/${TS_REPOSITORY:-default}/statements
      WISSKI_DEFAULT_DATA_MODEL_VERSION: ${WISSKI_DEFAULT_DATA_MODEL_VERSION:-true}
      WISSKI_DEFAULT_GRAPH: ${WISSKI_DEFAULT_GRAPH:-https://my.wiss-ki.eu/}
      WISSKI_STARTER_VERSION: ${WISSKI_STARTER_VERSION:-true}
    volumes:
      - drupal-sites:/opt/drupal/web/sites
      - drupal-private-files:/opt/drupal/private-files
      - drupal-custom-modules:/opt/drupal/web/modules/custom
      - drupal-custom-themes:/opt/drupal/web/themes/custom
      - composer-cache:/var/composer-home
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 30m
    deploy:
      resources:
        limits:
          cpus: ${DRUPAL_CPUS:-2.0}
          memory: ${DRUPAL_MEMORY:-2G}
        reservations:
          cpus: "0.5"
          memory: 512M

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-wisski}
      POSTGRES_USER: ${DB_USER:-wisski}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wisski}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=200
      - -c
      - wal_buffers=16MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_cache_size=1536MB
      - -c
      - log_min_messages=warning
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres/init-pg_trgm.sql:/docker-entrypoint-initdb.d/01-pg_trgm.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1000 --appendonly no --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M

  solr:
    image: solr:9.7
    profiles: [solr]
    restart: unless-stopped
    ports:
      - ${SOLR_PORT:-8983}:8983
    environment:
      SOLR_JAVA_MEM: "-Xms512M -Xmx1G"
      SOLR_ULIMIT_CHECKS: "false"
      SOLR_OPTS: "-Djava.security.manager=allow"
    ulimits:
      nofile:
        soft: 65000
        hard: 65000
    volumes:
      - solr-data:/var/solr
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8983/solr/admin/info/system"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 512M

  varnish:
    image: varnish:7.6
    profiles: [production]
    restart: unless-stopped
    depends_on:
      drupal:
        condition: service_healthy
    environment:
      VARNISH_SIZE: ${VARNISH_SIZE:-256M}
    configs:
      - source: varnish_vcl
        target: /etc/varnish/default.vcl
    tmpfs:
      - /var/lib/varnish/varnishd:exec,uid=999,gid=999
    ulimits:
      memlock:
        soft: 536870912
        hard: 536870912
    healthcheck:
      test: ["CMD", "varnishstat", "-1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  # Overlay OpenGDB rdf4j: fix volume UID, cap heap, wait until the protocol is up.
  rdf4j:
    user: "0:0"
    environment:
      JAVA_OPTS: -Xms256m -Xmx1g -Dhttp.nonProxyHosts="" -Dhttp.proxyHost=outproxy -Dhttp.proxyPort=8080 -Dhttps.proxyHost=outproxy -Dhttps.proxyPort=8080
    volumes:
      - ./config/opengdb/rdf4j-entrypoint.sh:/rdf4j-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/rdf4j-entrypoint.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /rdf4j-server/protocol HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -qE \"^HTTP/1\\.[01] 200\" <&3'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 256M

  # Overlay OpenGDB nginx: short Docker DNS TTL, wait for uWSGI.
  nginx:
    volumes:
      - ./config/opengdb/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    depends_on:
      rdf4j:
        condition: service_healthy
      authproxy:
        condition: service_healthy
      outproxy:
        condition: service_started

  authproxy:
    # OpenGDB uWSGI logs every SPARQL query string to stdout. Keep 4xx/5xx.
    command:
      - uwsgi
      - --ini
      - /app/docker/uwsgi.ini
      - --disable-logging
      - --log-4xx
      - --log-5xx
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null --timeout=3 http://127.0.0.1:8000/admin/login/",
        ]
      interval: 30s
      timeout: 5s
      retries: 18
      start_period: 40s

  pgadmin:
    image: dpage/pgadmin4:8
    profiles: [tools]
    restart: unless-stopped
    ports:
      - ${PGADMIN_PORT:-8081}:80
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-wisski}
      DB_USER: ${DB_USER:-wisski}
      DB_PASSWORD: ${DB_PASSWORD:-wisski}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./config/pgadmin/servers.json:/config/servers.json:ro
      - ./config/pgadmin/entrypoint.sh:/config/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/config/entrypoint.sh"]

volumes:
  drupal-sites:
  drupal-private-files:
  drupal-custom-modules:
  drupal-custom-themes:
  composer-cache:
  postgres-data:
  redis-data:
  solr-data:
  pgadmin-data:
