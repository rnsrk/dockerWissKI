# Optional: build the Drupal image locally instead of pulling GHCR.
# Append to COMPOSE_FILE, e.g.
# COMPOSE_FILE=docker-compose.yml:docker-compose.development.yml:docker-compose.local-build.yml
#
# Build args without a value come from .env; when unset, the ARG default in
# drupal/Dockerfile applies. That Dockerfile is the only place that pins the
# WissKI package set (WISSKI_PACKAGES_VERSION / WISSKI_PACKAGES_LINE).

services:
  drupal:
    build:
      context: ./drupal
      args:
        - MODE
        - WISSKI_PACKAGES_VERSION
        - WISSKI_PACKAGES_LINE
        - DEV_UID
        - DEV_GID
    develop:
      watch:
        - action: rebuild
          path: ./drupal
