# Apple Silicon (M1/M2/M3): run amd64 images via Rosetta.
# Append to COMPOSE_FILE, e.g.
# COMPOSE_FILE=docker-compose.yml:docker-compose.development.yml:docker-compose.apple-silicon.yml

services:
  drupal:
    platform: linux/amd64
  postgres:
    platform: linux/amd64
  redis:
    platform: linux/amd64
  solr:
    platform: linux/amd64
  varnish:
    platform: linux/amd64
  pgadmin:
    platform: linux/amd64
  rdf4j:
    platform: linux/amd64
  nginx:
    platform: linux/amd64
  authproxy:
    platform: linux/amd64
  outproxy:
    platform: linux/amd64
