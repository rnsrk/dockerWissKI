# Apple Silicon (M1/M2/M3): run the amd64-only images via Rosetta.
# Append to COMPOSE_FILE, e.g.
# COMPOSE_FILE=docker-compose.yml:docker-compose.development.yml:docker-compose.apple-silicon.yml
#
# Only the images that are published for linux/amd64 alone need this: the
# Drupal image (see PLATFORMS in .github/workflows/build-image.yml) and the
# OpenGDB outproxy. Everything else has arm64 images or is built locally.

services:
  drupal:
    platform: linux/amd64
  outproxy:
    platform: linux/amd64
